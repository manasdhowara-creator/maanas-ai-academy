<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maanas AI Academy</title>
<meta name="description" content="Learn it. Prove it. Master it. A personal AI teacher and mastery engine.">
<meta name="theme-color" content="#2E3FD6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="#dashboard" aria-label="Maanas AI Academy home">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-text"><b>Maanas</b> AI Academy</span>
    </a>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <header class="topbar" id="topbar">
      <a class="brand brand-sm" href="#dashboard" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-text"><b>Maanas</b> AI Academy</span>
      </a>
      <div class="topbar-right">
        <span class="ai-pill" id="aiPill" title="AI teacher status">AI: checking…</span>
      </div>
    </header>
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="All sections" id="sheetPanel"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/mastery.js"></script>
<script src="js/revision.js"></script>
<script src="js/quiz.js"></script>
<script src="js/pack.js"></script>
<script src="js/source.js"></script>
<script src="js/video.js"></script>
<script src="js/lesson.js"></script>
<script src="js/coach.js"></script>
<script src="js/research.js"></script>
<script src="js/coding.js"></script>
<script src="js/exam.js"></script>
<script src="js/labs.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
